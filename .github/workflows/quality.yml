name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install check tools
        run: python -m pip install -r scripts/requirements-quality.txt
      - name: Lint Python tools
        run: python -m ruff check scripts
      - name: Check Python formatting
        run: python -m ruff format --check scripts
      - name: Check project documentation
        run: python scripts/check_docs.py
      - name: Check shared workbench theme
        run: python scripts/check_workbench_theme.py

  cpp-build:
    name: C++ build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain versions
        run: |
          cmake --version
          ninja --version
          c++ --version
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --output-on-failure --no-tests=error
      - name: Install C++ check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18 clang-tidy-18
      - name: Check C++ formatting
        run: find src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - name: Analyze C++ sources
        run: clang-tidy-18 -p build/dev src/plugin_host.cpp src/project_store.cpp src/workspace.cpp src/cli.cpp src/platform_project.cpp src/voxel_world.cpp src/sandbox_rules.cpp src/voxel_content.cpp

  windows-workbench:
    name: Windows workbench smoke
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Qt SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O "$env:RUNNER_TEMP/Qt"
      - name: Build and smoke test the workbench
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw "MSVC x64 tools not found." }
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $qt = "$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64"
          $env:PATH = "$qt/bin;$env:PATH"
          cmake --preset dev -B build/studio -DCMAKE_BUILD_TYPE=Release -DWDS_BUILD_MODERN_STUDIO=ON -DWDS_BUILD_W15_LAB=ON "-DCMAKE_PREFIX_PATH=$qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/studio --target wds_studio_modern wds_w15_server wds_w15_layers
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/studio -R '^(workbench_|w15_)' --output-on-failure --no-tests=error
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --install build/studio --component Workbench --prefix build/workbench-dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path 'build/workbench-dist/*' -DestinationPath build/wds-workbench-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wds-workbench-windows-x64
          path: build/wds-workbench-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  posix-workbench:
    name: Workbench smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: macos-15
            qt_host: mac
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Qt SDK
        env:
          QT_HOST: ${{ matrix.qt_host }}
          QT_ARCH: ${{ matrix.qt_arch }}
        run: |
          python -m pip install aqtinstall==3.3.0
          python -m aqt install-qt "$QT_HOST" desktop 6.8.3 "$QT_ARCH" -O "$RUNNER_TEMP/Qt"
      - name: Build and smoke test the workbench
        run: |
          qt_config=$(find "$RUNNER_TEMP/Qt/6.8.3" -name Qt6Config.cmake -print -quit)
          test -n "$qt_config"
          cmake --preset dev -B build/studio -DCMAKE_BUILD_TYPE=Release -DWDS_BUILD_MODERN_STUDIO=ON -DWDS_BUILD_W15_LAB=ON "-DQt6_DIR=$(dirname "$qt_config")"
          cmake --build build/studio --target wds_studio_modern wds_w15_server wds_w15_layers --parallel 2
          ctest --test-dir build/studio -R '^(workbench_|w15_)' --output-on-failure --no-tests=error
      - name: Archive the installed workbench
        run: |
          cmake --install build/studio --component Workbench --prefix build/workbench-dist
          tar -C build/workbench-dist -czf build/wds-workbench.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wds-workbench-${{ matrix.os }}
          path: build/wds-workbench.tar.gz
          if-no-files-found: error
          retention-days: 14
